[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storage-analyzer"
version = "8.1.0"
description = "Industrial-grade disk storage analyzer and safe cleanup tool. Cross-platform, AI-agent-compatible."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Storage Analyzer Contributors"},
]
keywords = ["storage", "cleanup", "disk", "analyzer", "ai-tools", "skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
full = ["psutil>=5.9"]
ai = ["requests>=2.28"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
sa = "engine.main:main"
sa-snapshot = "scripts.snapshot:main"

[project.entry-points."storage_analyzer.cleaners"]

[project.urls]
Homepage = "https://github.com/your-org/storage-analyzer"
Issues = "https://github.com/your-org/storage-analyzer/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "cleaners*", "scripts*", "v8*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"engine" = ["**/*.py"]
"cleaners" = ["**/*.py"]
"v8" = ["**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
